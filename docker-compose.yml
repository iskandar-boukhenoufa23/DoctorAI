services:
  postgres:
    image: postgres:16-alpine
    container_name: doctor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: doctor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: doctor_ai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - doctor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctor -d doctor_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
    container_name: doctor-ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      CHROMA_PERSIST_DIR: /srv/data/chroma
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - doctor_vectors:/srv/data/chroma
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: doctor-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://doctor:${POSTGRES_PASSWORD}@postgres:5432/doctor_ai?schema=public
      AI_SERVICE_URL: http://ai-service:8000
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api
    container_name: doctor-frontend
    restart: unless-stopped
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - backend

volumes:
  doctor_postgres:
  doctor_vectors: